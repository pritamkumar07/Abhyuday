<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121214">
    <title>Mess Coupon - Student Portal</title>
    <meta name="description" content="Student Hostel Mess Coupon Details">
    <link rel="stylesheet" href="mess_coupon.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="main-page-body">

    <div class="card-wrapper">
        <!-- Main Gradient Card Container -->
        <div class="gradient-card">
            
            <!-- Student Avatar & Name Header -->
            <div class="profile-header">
                <div class="avatar-box">
                    <img src="avi_potrait.png" alt="Abhyuday">
                </div>
                <h2 class="student-title">Abhyuday 12517257</h2>
            </div>

            <!-- Student Details List -->
            <div class="student-info-list">
                <div class="info-block">
                    <span class="info-label">Father's Name</span>
                    <span class="info-val">Birender Singh Yadav (8873922792)</span>
                </div>

                <div class="info-block">
                    <span class="info-label">Mother's Name</span>
                    <span class="info-val">Parwati  Devi (8873922792)</span>
                </div>

                <div class="info-block">
                    <span class="info-label">Program Name</span>
                    <span class="info-val">P132:B.Tech. (Computer Science and Engineering)(2025)</span>
                </div>

                <div class="info-block">
                    <span class="info-label">Hostel</span>
                    <span class="info-val">Boys Hostel-04- E903 - Bed B (Standard Air Cooler 5 Seater)</span>
                </div>
            </div>

            <!-- Meals Grid Container (Matching Screenshot Exact Layout) -->
            <div class="meals-white-container">
                <div class="meals-grid">
                    
                    <!-- Breakfast Button Card -->
                    <a href="scan.html?meal=Breakfast" class="meal-button-card">
                        <span class="meal-button-text">Breakfast</span>
                    </a>

                    <!-- Lunch Button Card -->
                    <a href="scan.html?meal=Lunch" class="meal-button-card">
                        <span class="meal-button-text">Lunch</span>
                    </a>

                    <!-- Dinner Button Card (Full Width) -->
                    <a href="scan.html?meal=Dinner" class="meal-button-card full-width">
                        <span class="meal-button-text">Dinner</span>
                    </a>

                </div>
            </div>

        </div>
    </div>

</body>
</html>
